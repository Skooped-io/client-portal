name: social-publish

# Ticks /api/cron/social-publish every 5 minutes. The tick only RECONCILES:
# it reads Meta-held scheduled Facebook posts back and marks rows
# published/cancelled, and sweeps stuck rows. It never creates or publishes
# anything (product rule 2026-09-01: Skooped only ever schedules; Joseph
# reviews in Business Suite and Meta publishes).
# Vercel Hobby only allows once-a-day crons (a */5 entry in vercel.json fails
# the whole deploy), so the 5-minute tick lives here; vercel.json keeps a
# once-daily safety sweep of the same reconciliation.
# The route authenticates by Bearer CRON_SECRET or SOCIAL_CRON_SECRET — the
# repository secret is named SOCIAL_CRON_SECRET (value = Vercel env SOCIAL_CRON_SECRET).
# GitHub may delay or skip a scheduled run under load; the route is
# idempotent (read-only against Meta), so overlapping or late ticks are safe.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: social-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger the publisher
        env:
          CRON_SECRET: ${{ secrets.SOCIAL_CRON_SECRET }}
        run: |
          set -u
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set on this repository" >&2
            exit 1
          fi
          curl -fsS --max-time 310 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://app.skooped.io/api/cron/social-publish
