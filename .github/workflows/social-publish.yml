name: social-publish

# Drives /api/cron/social-publish every 5 minutes. Vercel Hobby only allows
# once-a-day crons (a */5 entry in vercel.json fails the whole deploy), so
# the 5-minute tick lives here; vercel.json keeps a once-daily safety sweep.
# The route authenticates by Bearer CRON_SECRET (same value as the Vercel
# env var) — add it as a repository secret named CRON_SECRET.
# GitHub may delay or skip a scheduled run under load; the route is
# idempotent (compare-and-swap claims), so overlapping or late ticks are safe.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: social-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger the publisher
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set on this repository" >&2
            exit 1
          fi
          curl -fsS --max-time 310 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://app.skooped.io/api/cron/social-publish
